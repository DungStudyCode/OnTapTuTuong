<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Study</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Màn hình Trang chủ -->
        <div id="home-screen" class="screen active">
            <div class="header-logo">
                <h1>Quiz Study</h1>
                <p class="subtitle">Hệ thống ôn tập kiến thức</p>
            </div>
            
            <div class="stats-card">
                <h2>Thống kê học tập</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="stat-total">0</span>
                        <span class="stat-label">Câu đã làm</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value text-success" id="stat-correct">0</span>
                        <span class="stat-label">Câu đúng</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value text-primary" id="stat-accuracy">0%</span>
                        <span class="stat-label">Tỷ lệ chính xác</span>
                    </div>
                </div>
            </div>
            
            
            <div class="stats-card">
                <h2>Chọn bộ câu hỏi</h2>
                <div class="set-selection" style="display: flex; gap: 10px; flex-direction: column;">
                    <button id="btn-set1" class="btn outline" style="border: 1px solid var(--primary); color: var(--primary);">Bộ 1 (Câu 1 - 30)</button>
                    <button id="btn-set2" class="btn outline" style="border: 1px solid var(--primary); color: var(--primary);">Bộ 2 (Câu 31 - 60)</button>
                    <button id="btn-set3" class="btn outline" style="border: 1px solid var(--primary); color: var(--primary);">Bộ 3 (Câu 61 - 90)</button>
                    <button id="btn-set-short" class="btn outline" style="border: 1px solid var(--primary); color: var(--primary);">Bộ 4: Trả lời ngắn (40 câu)</button>
                    <button id="btn-set-all" class="btn primary">Ôn tập tất cả (130 câu)</button>
                </div>
            </div>

        </div>

        <!-- Màn hình Làm bài -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-counter" class="badge">Câu 1/30</span>
                <span id="timer" class="badge timer-badge">00:00</span>
            </div>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            
            <div class="question-container">
                <h2 id="question-text">Nội dung câu hỏi?</h2>
                <div id="options-grid" class="options-grid">
                    <!-- Đáp án được chèn bằng JS -->
                </div>
                
                <div id="feedback-container" class="feedback hidden">
                    <p id="feedback-message" class="message"></p>
                    <p id="feedback-explanation" class="explanation"></p>
                </div>
            </div>
            
            <button id="btn-next" class="btn primary hidden">Câu tiếp theo</button>
        </div>

        <!-- Màn hình Kết quả -->
        <div id="result-screen" class="screen">
            <h2>Kết quả bài làm</h2>
            
            <div class="result-summary">
                <div class="score-circle">
                    <span id="final-score">0/30</span>
                </div>
                <div class="result-details">
                    <p>Thời gian: <strong id="final-time">00:00</strong></p>
                    <p>Tỷ lệ chính xác: <strong id="final-accuracy">0</strong>%</p>
                </div>
            </div>
            
            <div id="wrong-answers-container" class="wrong-answers hidden">
                <h3>Các câu cần ôn lại:</h3>
                <div id="wrong-answers-list">
                    <!-- Danh sách câu sai chèn bằng JS -->
                </div>
            </div>

            <div class="btn-group">
                <button id="btn-retry" class="btn primary">Làm lại bài mới</button>
                <button id="btn-retry-wrong" class="btn secondary hidden">Ôn lại các câu sai</button>
                <button id="btn-home" class="btn outline">Về trang chủ</button>
            </div>
        </div>
    </div>

    <!-- Tải script -->
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
